[project]
name = "kalshi-research-terminal-backend"
version = "0.1.0"
description = "Local-only research and paper-trading backend. No live order submission."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "tzdata>=2024.1",  # IANA zones for zoneinfo on Windows
    "scipy>=1.13",  # beta/normal distributions for probability models
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.adapters" = ["fixtures/*.json"]
"app.signals" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
